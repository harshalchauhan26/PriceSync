# Render Blueprint for PriceSync (MBO Tracker).
# The app is a single always-on Node service: it builds the Vite React client
# and the Express server serves that build + the /api routes from ONE process.
# Pipeline state, login sessions, rate-limits and the live log live in memory,
# so this MUST run as a single Node instance (numInstances: 1) — NOT Python,
# NOT serverless, and never scaled past one instance.
#
# To use: Render → New → Blueprint → pick this repo. It creates a Node service
# with the settings below; then fill in the secret env vars (sync:false ones)
# in the dashboard. Existing Python service can't be switched to Node in place —
# this Blueprint stands up the correct Node service.
services:
  - type: web
    name: pricesync
    runtime: node
    region: singapore            # closest Render region to the Mumbai (ap-south-1) Supabase DB
    plan: free                   # ⚠ Free spins down when idle and LOSES in-memory pipeline/session
                                 #    state mid-run. Upgrade to "starter" before relying on it.
    branch: main
    numInstances: 1              # do not increase — in-memory state breaks with 2+ instances
    buildCommand: cd web/client && npm ci && npm run build && cd ../server && npm ci
    startCommand: cd web/server && npm start
    healthCheckPath: /api/health
    autoDeploy: true             # redeploy on every push to main
    envVars:
      # --- required (enter values in the dashboard; never commit secrets) ---
      - key: SUPABASE_DB_URL
        sync: false              # Mumbai session-pooler / direct Postgres URI
      - key: SECRET_KEY
        sync: false              # long random hex — signs sessions + encrypts the Shopify token.
                                 # MUST stay identical across redeploys or the saved token won't decrypt.
      # ADMIN_EMAIL/ADMIN_PASSWORD are legacy/unused — do NOT repurpose them
      # for the super-admin bootstrap below (see the 2026-07-23 incident note
      # in config.js: sharing that email with a real tenant-owner login
      # caused it to flap between roles on every restart).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # --- platform super-admin (cross-tenant support role) — OPTIONAL, leave
      # both blank/unset to disable seeding entirely (the safe default). If
      # you do want one, use a NEW email you don't also log in with as a
      # tenant owner. ---
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # --- registration: MBOs (tenants) are provisioned via
      # `node scripts/create-tenant.mjs`. Password self-signup (/api/register)
      # stays closed, but Google sign-in DOES self-serve — a new email gets a
      # viewer account on tenant #1 with approved=false, which has no access to
      # any tenant data until that tenant's owner approves it in Settings →
      # Users. Requires GOOGLE_CLIENT_ID below; leave it unset to disable. ---
      # --- email reports (start / 50% / complete+2 sheets / errors-resolved) ---
      #
      # ⚠ SMTP DOES NOT WORK ON THE FREE PLAN. Render blocks outbound traffic to
      # ports 25/465/587 on free web services (policy change 2025-09-26), so
      # nodemailer can never reach smtp.gmail.com and every send dies with
      # "Connection timeout" even though the credentials are valid. Port 25 is
      # blocked on ALL plans; 465/587 work only on a PAID instance.
      #
      # Two ways to get mail working:
      #   1. Upgrade this service to a paid instance -> the SMTP_* vars below
      #      start working as-is, no code or config change. (Also fixes the
      #      free-plan spin-down that loses in-memory pipeline state mid-run.)
      #   2. Stay on free and set ONE HTTPS provider key below. These send over
      #      443, which is not blocked, and support the .xlsx attachments.
      #      GET /api/health reports which transport is live as email_provider.
      - key: RESEND_API_KEY
        sync: false              # resend.com — needs a verified domain to send to arbitrary inboxes
      - key: BREVO_API_KEY
        sync: false              # brevo.com — 300/day free, single verified sender is enough
      - key: SENDGRID_API_KEY
        sync: false              # sendgrid.com — 100/day free, single verified sender is enough
      - key: MAIL_FROM
        sync: false              # REQUIRED with an HTTPS provider (no SMTP_USER to fall back on).
                                 # Must be an address that provider has verified.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false              # Gmail app password
      - key: SMTP_FROM
        sync: false
      - key: ALERT_TO
        sync: false              # where the pipeline reports go
      # --- fetch relay (lets cloud runs reach IP-banned brands; optional) ---
      - key: FETCH_RELAY_URL
        sync: false
      - key: FETCH_RELAY_SECRET
        sync: false
      # --- optional ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MAX_CONCURRENT_RUNS
        value: "3"
      # NOTE: do NOT set NODE_PORT on Render — the platform injects PORT, and
      # leaving NODE_PORT unset makes the app bind 0.0.0.0 with secure cookies.
      # There is NO PYTHON_VERSION here — this is a Node service.
